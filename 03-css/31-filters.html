<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>-FILTERS.CSS</title>

    <link rel="stylesheet" href="../src/css/03-css.css">
    <link rel="stylesheet" href="../src/css/externalfile.css">
</head>

<body style="display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; min-height: 100vh !important; margin: 0 !important; box-sizing: border-box !important; position: relative !important; padding: 40px 20px !important;">

    <a href="../03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>

    <div style="text-align: center !important; width: 100% !important; margin-bottom: 30px !important; color: #ffffff !important;">
        <h1 style="margin: 0 !important; padding: 0 !important; font-size: 2.5rem !important;">FILTERS.CSS</h1>
        <p style="margin: 5px 0 0 0 !important; padding: 0 !important; font-size: 1.1rem !important; opacity: 0.8 !important;"></p>
    </div>

    <div style="display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 40px !important; width: 100% !important; max-width: 500px !important; box-sizing: border-box !important;">

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: blur(5px)</span>
            <img src="../src/imgs/bt21.png" alt="Blur" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='blur(5px)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: brightness(1.8)</span>
            <img src="../src/imgs/bt21.png" alt="Brightness" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='brightness(1.8)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: contrast(200%)</span>
            <img src="../src/imgs/bt21.png" alt="Contrast" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='contrast(200%)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: saturate(300%)</span>
            <img src="../src/imgs/bt21.png" alt="Saturate" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='saturate(300%)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: grayscale(100%)</span>
            <img src="../src/imgs/bt21.png" alt="Grayscale" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='grayscale(100%)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: sepia(100%)</span>
            <img src="../src/imgs/bt21.png" alt="Sepia" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='sepia(100%)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: invert(100%)</span>
            <img src="../src/imgs/bt21.png" alt="Invert" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='invert(100%)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: opacity(0.3)</span>
            <img src="../src/imgs/bt21.png" alt="Opacity" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='opacity(0.3)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color: #94a3b8 !important; display: block !important; margin-bottom: 8px !important; font-family: monospace !important; font-size: 1rem !important;">filter: hue-rotate(180deg)</span>
            <img src="../src/imgs/bt21.png" alt="Hue Rotate" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='hue-rotate(180deg)'" onmouseout="this.style.filter='none'">
        </div>

        <div style="text-align: center !important; width: 100% !important;">
            <span style="color:#38bdf8 !important;display:block !important;margin-bottom:8px !important;font-family:monospace !important;font-size:1rem !important;font-weight:bold !important;">Efecto Combinado</span>
            <img src="../src/imgs/bt21.png" alt="Combined Filter" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:block;transition:filter .3s ease;" onmouseover="this.style.filter='blur(2px) brightness(1.2) saturate(150%)'" onmouseout="this.style.filter='none'">
        </div>

    </div>

</body>

</html>
