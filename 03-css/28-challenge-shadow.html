            --color-blue: #9C99FF;
            --color-pink: #FF9CC3;
            --pixel-size: 20px;

        /* ============================================
                   CONTENEDOR PRINCIPAL
                   ============================================ */
        figure.frame {
            background: #fff;
            width: calc(35 * var(--pixel-size));
            height: calc(35 * var(--pixel-size));
            margin: 2rem auto;
            position: relative;
            overflow: hidden;
            transform: scale(0.60);
            transform-origin: top center;
            border: 2px solid #ddd;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

                   CUADRÍCULA DE FONDO
                   ============================================ */
        div.squares {

            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
