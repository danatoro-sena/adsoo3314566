<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-JavaScript</title>
    <link rel="stylesheet" href="../src/css/02-Html.css">
</head>
<section>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* Botón home */
        .btn-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 100;
        }
        .btn-home:hover {
            background: #ff6b4a;
            transform: scale(1.1);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff6b4a, #ffa07a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        header h2 {
            font-size: 1rem;
            font-weight: normal;
            color: #ccc;
        }

        /* Contenedor principal del formulario */
        .form-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Estilo del formulario */
        .modern-form {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Tarjetas para cada fieldset */
        .form-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 107, 74, 0.3);
            transition: 0.3s;
        }
        .form-card:hover {
            border-color: #ff6b4a;
            box-shadow: 0 4px 15px rgba(255, 107, 74, 0.2);
        }

        legend {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffa07a;
            padding: 0 12px;
            width: auto;
        }

        /* Grid para inputs */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffa07a;
        }

        .input-group label i {
            margin-right: 6px;
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 0.9rem;
            transition: 0.3s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff6b4a;
            box-shadow: 0 0 8px rgba(255, 107, 74, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Checkbox y radio en línea */
        .inline-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            margin-top: 8px;
        }
        .inline-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            color: #ddd;
        }
        .inline-group input {
            width: auto;
        }

        /* Rango */
        input[type="range"] {
            padding: 0;
        }

        /* Color picker */
        input[type="color"] {
            height: 45px;
            padding: 5px;
        }

        /* Botones */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #ff6b4a, #e64a2e);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 74, 0.4);
        }
        .btn-reset {
            background: linear-gradient(135deg, #555, #333);
        }
        .btn-reset:hover {
            background: linear-gradient(135deg, #777, #555);
        }

        /* File custom */
        input[type="file"] {
            padding: 8px;
        }

        /* Select múltiple */
        select[multiple] {
            min-height: 100px;
        }

        hr {
            border-color: rgba(255, 107, 74, 0.3);
            margin: 15px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-container {
                padding: 0;
            }
            .modern-form {
                padding: 20px;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <a href="../02-html/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>11-Forms</h1>
            <h2>Crea formularios interactivos para entradas de usuario.</h2>
        </header>
    <main>
    <header>
        <h1>✨ Formulario Interactivo</h1>
        <h2>Completa todos los campos con la información solicitada</h2>
    </header>

    <div class="form-container">
        <form action="#" method="post" enctype="multipart/form-data" autocomplete="on" novalidate class="modern-form">

            <!-- SECCIÓN 1: Información personal -->
            <fieldset class="form-card">
                <legend>👤 Información Personal</legend>
                <div class="form-grid">
                    <div class="input-group">
                        <label><i>📝</i> Nombre completo</label>
                        <input type="text" name="nombre" size="30" maxlength="50" placeholder="Ej: Ana Pérez" required autofocus>
                    </div>
                    <div class="input-group">
                        <label><i>📧</i> Correo electrónico</label>
                        <input type="email" name="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="input-group">
                        <label><i>🔐</i> Contraseña</label>
                        <input type="password" name="password" size="20" maxlength="20" placeholder="*****">
                    </div>
                    <div class="input-group">
                        <label><i>🎂</i> Fecha de nacimiento</label>
                        <input type="date" name="fecha">
                    </div>
                    <div class="input-group">
                        <label><i>🕒</i> Hora favorita</label>
                        <input type="time" name="hora">
                    </div>
                    <div class="input-group">
                        <label><i>📅</i> Semana</label>
                        <input type="week" name="semana">
                    </div>
                    <div class="input-group">
                        <label><i>📆</i> Mes</label>
                        <input type="month" name="mes">
                    </div>
                </div>
            </fieldset>

            <!-- SECCIÓN 2: Preferencias -->
            <fieldset class="form-card">
                <legend>🎨 Preferencias</legend>
                <div class="form-grid">
                    <div class="input-group">
                        <label><i>🎨</i> Color favorito</label>
                        <input type="color" name="color" value="#ff6b4a">
                    </div>
                    <div class="input-group">
                        <label><i>🔢</i> Edad (18-99)</label>
                        <input type="number" name="edad" min="18" max="99" step="1" value="25">
                    </div>
                    <div class="input-group">
                        <label><i>📊</i> Nivel de satisfacción (0-10)</label>
                        <input type="range" name="rango" min="0" max="10" step="1">
                    </div>
                </div>

                <div class="input-group">
                    <label><i>⚧</i> Género</label>
                    <div class="inline-group">
                        <label><input type="radio" name="genero" value="masculino"> Masculino</label>
                        <label><input type="radio" name="genero" value="femenino"> Femenino</label>
                        <label><input type="radio" name="genero" value="otro"> Otro</label>
                    </div>
                </div>

                <div class="input-group">
                    <label><i>✅</i> Suscripción</label>
                    <div class="inline-group">
                        <label><input type="checkbox" name="suscripcion" value="newsletter" checked> Recibir noticias</label>
                    </div>
                </div>
            </fieldset>

            <!-- SECCIÓN 3: Archivo y comentarios -->
            <fieldset class="form-card">
                <legend>📎 Adjuntos y Comentarios</legend>
                <div class="form-grid">
                    <div class="input-group">
                        <label><i>📂</i> Subir archivo (imagen)</label>
                        <input type="file" name="archivo" accept="image/png, image/jpeg">
                    </div>
                    <div class="input-group">
                        <label><i>💬</i> Comentarios</label>
                        <textarea name="comentarios" rows="4" placeholder="Escribe aquí tu comentario..." required></textarea>
                    </div>
                </div>
            </fieldset>

            <!-- SECCIÓN 4: Listas desplegables -->
            <fieldset class="form-card">
                <legend>🌍 Selecciona opciones</legend>
                <div class="form-grid">
                    <div class="input-group">
                        <label><i>🇵🇦</i> País</label>
                        <select name="pais" required>
                            <option value="" disabled selected>Selecciona un país</option>
                            <option value="mx">México</option>
                            <option value="es">España</option>
                            <option value="ar">Argentina</option>
                            <option value="co">Colombia</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label><i>🎯</i> Hobbies (múltiple)</label>
                        <select name="intereses" size="3" multiple>
                            <option value="deporte">⚽ Deporte</option>
                            <option value="musica" selected>🎵 Música</option>
                            <option value="lectura">📖 Lectura</option>
                            <option value="cine" selected>🎬 Cine</option>
                        </select>
                        <small style="color:#aaa;">Ctrl+clic para múltiples</small>
                    </div>
                </div>
                <div class="input-group">
                    <label><i>🚫</i> Select deshabilitado (ejemplo)</label>
                    <select disabled>
                        <option>Opción deshabilitada</option>
                    </select>
                </div>
            </fieldset>

            <!-- SECCIÓN 5: Botones extra -->
            <fieldset class="form-card">
                <legend>🔘 Acciones</legend>
                <div class="form-grid">
                    <div class="input-group">
                        <label><i>🔘</i> Botón normal</label>
                        <input type="button" value="Haz clic aquí" onclick="alert('¡Botón presionado!')" class="btn" style="background:#555;">
                    </div>
                    <div class="input-group">
                        <label><i>🖼️</i> Imagen como botón</label>
                        <input type="image" src="https://via.placeholder.com/120x40?text=Enviar+ahora" alt="Enviar" style="width:120px; border-radius:30px;">
                    </div>
                </div>
            </fieldset>

            <!-- Botones de envío -->
            <div class="btn-group">
                <input type="submit" value="📤 Enviar formulario" class="btn">
                <input type="reset" value="🗑️ Limpiar todo" class="btn btn-reset">
            </div>
        </form>
    </div>
    </section>
</body>
</html>
