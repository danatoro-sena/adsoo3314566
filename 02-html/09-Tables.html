<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>09-Tables</title>
    <link rel="stylesheet" href="../src/css/02-html.css">

    <style>
    body { 
        font-family: Arial, sans-serif;
        margin: 0;
        display: block !important; 
    }

    header {
        text-align: center;
        margin-top: 20px;
    }

    header h1 {
        color: #ffffff;
        margin-bottom: 5px;
    }

    header h2 {
        font-size: 16px;
        color: #ffffff;
    }

    .table-container {
        display: flex;
        justify-content: center;
        margin-top: 30px;
    }

    table {
        border-collapse: collapse;
        width: 80%;
        max-width: 800px;
        background-color: #FACBB7;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    th, td {
        padding: 12px;
        text-align: center;
    }

    th {
        background-color: #ff570f;
        color: white;
    }

    tr:nth-child(even) {
        background-color: #ffa36d;
    }

    tr:hover {
        background-color: #FACBB7;
    }
    </style>
</head>

<body>


  <a href="../02-html/index.html" class="btn-home">

            </path>
        </svg> </a>


<header>

</header>

  <tr>

  </tr>

</table>
</div>

</body>
</html>
